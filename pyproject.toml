[tool.flet.app]
path = "."
module = "main"

[project]
name = "jobhelper"
version = "0.1.0"

[tool.flet]
product = "JobHelper"
org = "com.yourname"
bundle_id = "com.yourname.jobhelper"

[tool.flet.flutter]
# 手动指定需要的flutter插件，删掉 connectivity_plus
dependencies = {
  flet = "1.0.3",
  file_picker = "11.0.3",
  flet_charts = "1.0.3",
  flet-dropzone = " 0.4.0",
  device_info_plus = "12.4.0",
  package_info_plus = "9.0.1",
  share_plus = "12.0.2",
  wakelock_plus = "1.5.2",
  screen_retriever = "0.2.1",
}

[tool.flet.flutter.pubspec.dependency_overrides]
jni = "^1.1.0"
connectivity_plus = "6.1.0"